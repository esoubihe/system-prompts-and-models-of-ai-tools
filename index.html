<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0e0d0b;font-family:'Segoe UI',system-ui,sans-serif;height:100%}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   Casa EP — first-person walkthrough.
   Geometry from a calibrated reading of the R01 plans at the
   confirmed lot size of 40 × 35 m (53.58 px/m on the sheets).

   Coordinates: meters. X = east, Z = south, Y = up.
   Origin = inner NW corner of the lot (house corner at 0.45, 0.35).

   Section: the whole garden/house podium sits at 0. The street
   runs along the south, sloping from -1.2 (west) to -2.8 (east).
   The subsolo (-3.3) is a semi-open parking court under the podium.
   Front of the lot, west→east: planted bank over a stone retaining
   wall · garden stair · vehicle ramp UP to the covered garage ·
   portal lane DOWN to the subsolo court.
   ================================================================ */

const FLOOR_G = 0, FLOOR_U = 3.5, FLOOR_B = -3.3;
const CEIL_G = 3.2, CEIL_U = 6.6, ROOF_T = 0.35;
const LOT = { x0:-1.66, z0:-2.0, x1:38.37, z1:33.0 };    // survey rectangle (40 × 35)
const HE = 35.0;                                          // house east face
const HW = 0.45, HN = 0.35;                               // house west / north faces
const streetY = x => -1.2 - (x - LOT.x0) * (1.6 / 40.0);  // sloping street level

// ---------------------------------------------------------------- renderer
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd9e2);
scene.fog = new THREE.Fog(0xbfd9e2, 90, 280);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 600);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xcfe4ee, 0xb9a98c, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d8, 2.0);
sun.position.set(-30, 52, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;  sun.shadow.camera.bottom = -50;
sun.shadow.camera.far = 180; sun.shadow.bias = -0.0004;
sun.target.position.set(18, 0, 14);
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xd8e4ee, 0.35);
fill.position.set(45, 28, -30); scene.add(fill);

// ---------------------------------------------------------------- textures (procedural)
function canvasTex(w, h, fn, repX=1, repY=1) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const texSlat = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#5d4530'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=16){
    const v=18-Math.random()*14;
    g.fillStyle=`rgb(${109+v},${82+v},${56+v})`; g.fillRect(x+1,0,12,h);
    g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(x+13,0,3,h);
  }
},4,4);
const texDeck = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#8a6a48'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=22){
    const v=14-Math.random()*22;
    g.fillStyle=`rgb(${150+v},${116+v},${82+v})`; g.fillRect(0,y+1,w,19);
    for(let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.08)';
      g.fillRect(Math.random()*w, y+2+Math.random()*16, 30+Math.random()*60, 1); }
    g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(0,y+20,w,2);
  }
},8,8);
const texTrav = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#e2d9c8'; g.fillRect(0,0,w,h);
  for(let i=0;i<700;i++){ g.fillStyle=`rgba(${170+Math.random()*50},${158+Math.random()*45},${135+Math.random()*40},.35)`;
    g.fillRect(Math.random()*w, Math.random()*h, 2+Math.random()*5, 1+Math.random()*2); }
  g.strokeStyle='rgba(120,108,90,.55)'; g.lineWidth=2;
  g.strokeRect(0,0,w,h); g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2,h); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
},10,10);
const texStone = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#b5a78f'; g.fillRect(0,0,w,h);
  let y=0;
  while(y<h){ const rh=14+Math.random()*16; let x=0;
    while(x<w){ const rw=26+Math.random()*40, v=26-Math.random()*48;
      g.fillStyle=`rgb(${181+v},${167+v},${143+v})`; g.fillRect(x+1,y+1,rw-2,rh-2);
      x+=rw; }
    y+=rh; }
},3,1.5);
const texGrass = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#7f9e58'; g.fillRect(0,0,w,h);
  for(let i=0;i<2400;i++){ const v=30-Math.random()*60;
    g.fillStyle=`rgb(${127+v},${158+v},${88+v})`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
},14,14);
const texWater = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#58b6c4'; g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){ g.strokeStyle=`rgba(255,255,255,${.05+Math.random()*.12})`; g.lineWidth=1+Math.random()*2;
    g.beginPath(); const y=Math.random()*h;
    g.moveTo(0,y); for(let x=0;x<=w;x+=16) g.lineTo(x, y+Math.sin(x*.1+i)*6);
    g.stroke(); }
},3,3);
const texCobble = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#9a917f'; g.fillRect(0,0,w,h);
  const s=32;
  for(let y=0;y<h;y+=s) for(let x=0;x<w;x+=s){
    const horiz=((x+y)/s)%2<1;
    for(let i=0;i<2;i++){
      const v=14-Math.random()*28;
      g.fillStyle=`rgb(${166+v},${156+v},${138+v})`;
      if(horiz) g.fillRect(x+1, y+1+i*(s/2), s-2, s/2-2);
      else g.fillRect(x+1+i*(s/2), y+1, s/2-2, s-2);
    }
  }
},10,10);
const texAsphalt = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#55534e'; g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){ const v=20-Math.random()*40;
    g.fillStyle=`rgb(${85+v},${83+v},${78+v})`;
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
},8,8);

// ---------------------------------------------------------------- materials
const M = {
  plasterExt : new THREE.MeshStandardMaterial({ color:0xefe8da, roughness:.92 }),
  plasterInt : new THREE.MeshStandardMaterial({ color:0xf6f1e6, roughness:.95 }),
  slat   : new THREE.MeshStandardMaterial({ map:texSlat, roughness:.8 }),
  deck   : new THREE.MeshStandardMaterial({ map:texDeck, roughness:.85 }),
  trav   : new THREE.MeshStandardMaterial({ map:texTrav, roughness:.6 }),
  stone  : new THREE.MeshStandardMaterial({ map:texStone, roughness:.95 }),
  grass  : new THREE.MeshStandardMaterial({ map:texGrass, roughness:1 }),
  water  : new THREE.MeshStandardMaterial({ map:texWater, transparent:true, opacity:.82, roughness:.15, metalness:.1 }),
  glass  : new THREE.MeshStandardMaterial({ color:0xbfdfe2, transparent:true, opacity:.22, roughness:.05, metalness:.3, side:THREE.DoubleSide }),
  frame  : new THREE.MeshStandardMaterial({ color:0x2c2622, roughness:.6 }),
  concrete : new THREE.MeshStandardMaterial({ color:0xb9b2a6, roughness:.95 }),
  cobble   : new THREE.MeshStandardMaterial({ map:texCobble, roughness:.9 }),
  asphalt  : new THREE.MeshStandardMaterial({ map:texAsphalt, roughness:.95 }),
  poolShell: new THREE.MeshStandardMaterial({ color:0xc7e6e4, roughness:.5 }),
  furnWood : new THREE.MeshStandardMaterial({ color:0x7a5a3c, roughness:.7 }),
  furnDark : new THREE.MeshStandardMaterial({ color:0x3a322a, roughness:.7 }),
  fabric   : new THREE.MeshStandardMaterial({ color:0xd9d2c2, roughness:.95 }),
  fabricOlv: new THREE.MeshStandardMaterial({ color:0x7d8b5e, roughness:.95 }),
  fabricRust:new THREE.MeshStandardMaterial({ color:0x9c5a3c, roughness:.9 }),
  white    : new THREE.MeshStandardMaterial({ color:0xfafaf6, roughness:.4 }),
  counter  : new THREE.MeshStandardMaterial({ color:0x4d423a, roughness:.35 }),
  screen   : new THREE.MeshStandardMaterial({ color:0x101418, roughness:.2, metalness:.4 }),
  trunk    : new THREE.MeshStandardMaterial({ color:0x8a7258, roughness:1 }),
  leaf     : new THREE.MeshStandardMaterial({ color:0x4e7a3a, roughness:1, side:THREE.DoubleSide }),
  carDark  : new THREE.MeshStandardMaterial({ color:0x23262b, roughness:.3, metalness:.6 }),
  carRed   : new THREE.MeshStandardMaterial({ color:0x7e1f1f, roughness:.3, metalness:.6 }),
  carSilver: new THREE.MeshStandardMaterial({ color:0x8e9298, roughness:.25, metalness:.7 }),
  rug      : new THREE.MeshStandardMaterial({ color:0xcec3ab, roughness:1 }),
};

// ---------------------------------------------------------------- groups + colliders
const G = {
  site: new THREE.Group(), ground: new THREE.Group(), upper: new THREE.Group(),
  roof: new THREE.Group(), base: new THREE.Group(), labels: new THREE.Group(),
};
Object.values(G).forEach(g => scene.add(g));
const colliders = [];
function addCollider(x0,y0,z0,x1,y1,z1){
  colliders.push({ min:new THREE.Vector3(Math.min(x0,x1),y0,Math.min(z0,z1)),
                   max:new THREE.Vector3(Math.max(x0,x1),y1,Math.max(z0,z1)) });
}
function box(group, mat, x0,y0,z0, x1,y1,z1, {collide=true, shadow=true, matBottom=null, visible=true} = {}){
  const w=Math.abs(x1-x0), h=Math.abs(y1-y0), d=Math.abs(z1-z0);
  const geo = new THREE.BoxGeometry(w,h,d);
  let m;
  if (matBottom){ m = new THREE.Mesh(geo, [mat,mat,mat,matBottom,mat,mat]); }
  else m = new THREE.Mesh(geo, mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  m.castShadow = shadow && visible; m.receiveShadow = true;
  m.visible = visible;
  group.add(m);
  if (collide) addCollider(Math.min(x0,x1),Math.min(y0,y1),Math.min(z0,z1),Math.max(x0,x1),Math.max(y0,y1),Math.max(z0,z1));
  return m;
}
/* Inclined surfaces: a smooth visible slab + invisible stepped colliders. */
function smoothRamp(group, mat, x0,x1, z0,z1, yA, yB, axis='x', th=0.22){
  // visible rotated slab
  const len = axis==='x' ? Math.abs(x1-x0) : Math.abs(z1-z0);
  const wid = axis==='x' ? Math.abs(z1-z0) : Math.abs(x1-x0);
  const slope = Math.atan2(yB-yA, len);
  const L = Math.hypot(len, yB-yA);
  const geo = new THREE.BoxGeometry(axis==='x'?L:wid, th, axis==='x'?wid:L);
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x0+x1)/2, (yA+yB)/2 - th/2, (z0+z1)/2);
  if (axis==='x') m.rotation.z = Math.sign(x1-x0)*slope;
  else m.rotation.x = -Math.sign(z1-z0)*slope;
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  // stepped colliders (invisible)
  const steps = Math.max(8, Math.round(len/0.35));
  for (let i=0;i<steps;i++){
    const t0=i/steps, t1=(i+1)/steps, ym=yA+(yB-yA)*(t0+t1)/2;
    if (axis==='x') box(group, mat, x0+(x1-x0)*t0, ym-th, z0, x0+(x1-x0)*t1, ym, z1, {visible:false});
    else box(group, mat, x0, ym-th, z0+(z1-z0)*t0, x1, ym, z0+(z1-z0)*t1, {visible:false});
  }
}
function wall(group, x0,z0, x1,z1, {y0=0, h=3.2, t=0.18, mat=M.plasterExt, openings=[]} = {}){
  const horiz = Math.abs(x1-x0) > Math.abs(z1-z0);
  const len = horiz ? Math.abs(x1-x0) : Math.abs(z1-z0);
  const sgn = horiz ? Math.sign(x1-x0)||1 : Math.sign(z1-z0)||1;
  const seg = (a,b, sy0,sy1, material) => {
    if (b-a < 0.01 || sy1-sy0 < 0.01) return;
    const isGlass = material === M.glass;
    const th = isGlass ? 0.05 : t;
    if (horiz){
      const xa = x0 + sgn*a, xb = x0 + sgn*b;
      box(group, material, Math.min(xa,xb), sy0, z0-th/2, Math.max(xa,xb), sy1, z0+th/2, {shadow:!isGlass});
    } else {
      const za = z0 + sgn*a, zb = z0 + sgn*b;
      box(group, material, x0-th/2, sy0, Math.min(za,zb), x0+th/2, sy1, Math.max(za,zb), {shadow:!isGlass});
    }
  };
  const ops = openings.slice().sort((p,q)=>p.a-q.a);
  let cur = 0;
  for (const o of ops){
    seg(cur, o.a, y0, y0+h, mat);
    const oy0 = o.y0 ?? (o.kind==='win' ? 0.9 : 0);
    const oy1 = o.y1 ?? (o.kind==='win' ? 2.4 : 2.3);
    if (oy0 > 0) seg(o.a, o.b, y0, y0+oy0, mat);
    if (oy1 < h) seg(o.a, o.b, y0+oy1, y0+h, mat);
    if (o.kind==='glass' || o.kind==='win') seg(o.a, o.b, y0+oy0, y0+oy1, M.glass);
    cur = o.b;
  }
  seg(cur, len, y0, y0+h, mat);
}
function railing(group, x0,z0,x1,z1, y0, h=1.05){
  if (Math.abs(x1-x0) > Math.abs(z1-z0)) box(group, M.slat, Math.min(x0,x1), y0, z0-0.04, Math.max(x0,x1), y0+h, z0+0.04);
  else box(group, M.slat, x0-0.04, y0, Math.min(z0,z1), x0+0.04, y0+h, Math.max(z0,z1));
}
function brise(group, x0,z0,x1,z1, y0, h){
  if (Math.abs(x1-x0) > Math.abs(z1-z0)) box(group, M.slat, Math.min(x0,x1), y0, z0-0.06, Math.max(x0,x1), y0+h, z0+0.06);
  else box(group, M.slat, x0-0.06, y0, Math.min(z0,z1), x0+0.06, y0+h, Math.max(z0,z1));
}

// ---------------------------------------------------------------- rooms registry
const ROOMS = [];
function room(name, floorY, x0,z0,x1,z1, {labelY=2.1} = {}){
  ROOMS.push({ name, floorY, x0,z0,x1,z1, cx:(x0+x1)/2, cz:(z0+z1)/2, labelY });
}

/* ===================== STREET, BANK & BOUNDARIES ===================== */
{
  // neighbour ground + street body
  box(G.site, M.grass, LOT.x0-30, streetY(LOT.x0)-0.5, -30, LOT.x0, streetY(LOT.x0), 33);
  box(G.site, M.grass, LOT.x1, streetY(LOT.x1)-0.5, -30, LOT.x1+30, streetY(LOT.x1), 33);
  box(G.site, M.grass, LOT.x0, -0.5, -30, LOT.x1, 0, LOT.z0);
  // sidewalk + street, sloping (smooth surfaces, slope sampled at strip ends)
  const yW = streetY(LOT.x0-30), yE = streetY(LOT.x1+30);
  smoothRamp(G.site, M.cobble,  LOT.x0-30, LOT.x1+30, 33.0, 36.1, yW-0.02, yE-0.02, 'x', 0.3);
  smoothRamp(G.site, M.asphalt, LOT.x0-30, LOT.x1+30, 36.1, 43.0, yW-0.14, yE-0.14, 'x', 0.3);
  smoothRamp(G.site, M.cobble,  LOT.x0-30, LOT.x1+30, 43.0, 45.0, yW-0.02, yE-0.02, 'x', 0.3);

  // street retaining wall along the front (z=33), stone-clad; openings:
  //   garden stair 26.3-27.7 · vehicle ramp 28.3-32.4 · portal 32.6-35.6
  const RW = (x0,x1,top=0.4) => { const yb = Math.min(streetY(x0), streetY(x1)) - 0.4;
    box(G.site, M.stone, x0, yb, 32.55, x1, top, 33.0); };
  RW(LOT.x0, 26.3);
  RW(27.7, 28.3);
  RW(32.4, 32.6, 0.0);
  RW(35.6, LOT.x1);
  // side + rear boundary: stone base + hedge
  box(G.site, M.stone, LOT.x0, 0, LOT.z0, LOT.x0+0.4, 2.1, 33.0);
  box(G.site, M.stone, LOT.x1-0.4, 0, LOT.z0, LOT.x1, 2.1, 27.0);
  box(G.site, M.stone, LOT.x0, 0, LOT.z0, LOT.x1, 2.1, LOT.z0+0.4);

/* ========================= POOL (in the podium) ====================== */
(function pool(){
  const cx=8.0, cz=21.8;
  const pts=[]; const N=28;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    const rx=6.3*(1+0.13*Math.sin(a*2.3+1.2)+0.06*Math.sin(a*4.7));
    const rz=3.3*(1+0.13*Math.sin(a*1.7+0.4)+0.05*Math.cos(a*3.3));
    pts.push(new THREE.Vector2(cx+Math.cos(a)*rx, cz+Math.sin(a)*rz));
  }
  const shape=new THREE.Shape(pts);
  const shell=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:1.55,bevelEnabled:false}), M.poolShell);
  shell.rotation.x=Math.PI/2; shell.position.y=0.02; shell.receiveShadow=true; G.site.add(shell);
  const water=new THREE.Mesh(new THREE.ShapeGeometry(shape), M.water);
  water.rotation.x=-Math.PI/2; water.position.y=-0.18; G.site.add(water);
  addCollider(1.5,-0.4,18.6, 14.4,-0.28,25.0);            // wade surface
  addCollider(1.0,-1.52,18.0, 15.4,-1.45,25.8);           // pool floor safety net
  box(G.site, M.poolShell, 13.0,-1.45,21.0, 13.9,-1.02,22.6);  // underwater exit steps
  box(G.site, M.poolShell, 13.9,-1.45,21.0, 14.5,-0.6,22.6);
  // concrete hull seen from the court below (slightly oversized to hide the shell sides)
  const pts2 = pts.map(p=>new THREE.Vector2(cx+(p.x-cx)*1.03, cz+(p.y-cz)*1.03));
  const hull=new THREE.Mesh(new THREE.ExtrudeGeometry(new THREE.Shape(pts2),{depth:1.3,bevelEnabled:false}), M.concrete);
  hull.rotation.x=Math.PI/2; hull.position.y=-0.33; G.base.add(hull);
})();

  if (['Piscina','Jardim / Pátio','Terraço Gourmet'].includes(r.name)) continue;
  const area = (r.x1-r.x0)*(r.z1-r.z0);
  if (area < 7) continue;
  const grp = r.floorY===FLOOR_U ? G.upper : G.ground;
  const p = new THREE.PointLight(0xffe9c8, Math.min(11, 3+area*0.1), Math.max(7, Math.sqrt(area)*1.6), 1.9);
  p.position.set(r.cx, r.floorY+2.7, r.cz);
  grp.add(p);
}

function palm(group,x,z,h=7,yBase=0){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.24,h,7), M.trunk);
  trunk.position.y=h/2; trunk.castShadow=true; g.add(trunk);
  for(let i=0;i<7;i++){
    const frond=new THREE.Mesh(new THREE.PlaneGeometry(3.1,0.75), M.leaf);
    frond.position.y=h;
    frond.rotation.y=i/7*Math.PI*2;
    frond.rotation.z=-0.45;
    frond.translateX(1.4);
    frond.castShadow=true;
    g.add(frond);
  }
  g.position.set(x,yBase,z); group.add(g);
}
function tree(group,x,y,z,h=3.4,r=1.8){
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.22,h,7), M.trunk);
  t.position.set(x,y+h/2,z); t.castShadow=true; group.add(t);
  for(let i=0;i<4;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(r*(0.55+Math.random()*0.4),10,8), M.leaf);
    s.position.set(x+(Math.random()-.5)*r, y+h+(Math.random()-.4)*r*.7, z+(Math.random()-.5)*r);
    s.castShadow=true; group.add(s);
  }
}

function rug(group, x,z, w,d, y=0, mat=M.rug){ box(group, mat, x-w/2,y+0.005,z-d/2, x+w/2,y+0.02,z+d/2, {collide:false, shadow:false}); }
function tv(group, x,z, w, yaw=0, y=0){
  const g=new THREE.Group();
  box(g, M.screen, -w/2,1.0,-0.03, w/2,1.0+w*0.42,0.03, {collide:false});
  g.position.set(x,y,z); g.rotation.y=yaw; group.add(g);
}
function counterRun(group, x0,z0,x1,z1, y=0, h=0.92){
  box(group, M.furnWood, Math.min(x0,x1),y,Math.min(z0,z1), Math.max(x0,x1),y+h-0.04,Math.max(z0,z1));
  box(group, M.counter, Math.min(x0,x1)-.02,y+h-0.04,Math.min(z0,z1)-.02, Math.max(x0,x1)+.02,y+h,Math.max(z0,z1)+.02, {collide:false});
}
function wardrobe(group, x0,z0,x1,z1, y=0, h=2.4){ box(group, M.furnWood, x0,y,z0, x1,y+h,z1); }
function shelves(group, x0,z0,x1,z1, y=0, h=2.2){ box(group, M.furnWood, x0,y,z0, x1,y+h,z1); }
function car(group, x,z, yaw=0, y=0, mat=M.carDark){
  const g=new THREE.Group();
  box(g, mat, -.92,.32,-2.2, .92,.75,2.2, {collide:false});
  box(g, mat, -.82,.75,-1.05, .82,1.25,0.85, {collide:false});
  for (const [sx,sz] of [[-1,-1.4],[1,-1.4],[-1,1.4],[1,1.4]]){
    const wgeo=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.24,16), M.furnDark);
    wgeo.rotation.z=Math.PI/2; wgeo.position.set(sx*.92,.33,sz); wgeo.castShadow=true; g.add(wgeo);
  }
  g.position.set(x,y,z); g.rotation.y=yaw; group.add(g);
  const across = Math.abs(Math.sin(yaw)) > 0.7;
  const ex = across ? 2.25 : 1.05, ez = across ? 1.05 : 2.25;
  addCollider(x-ex,y,z-ez, x+ex,y+1.25,z+ez);
}
function lounger(group, x,z, yaw=0){
  const g=new THREE.Group();
  box(g, M.deck, -.4,.25,-1.0, .4,.4,1.0, {collide:false});
  box(g, M.fabric, -.38,.4,-1.0, .38,.5,1.0, {collide:false});
  box(g, M.fabric, -.38,.4,.55, .38,.95,1.0, {collide:false});
  g.position.set(x,0,z); g.rotation.y=yaw; group.add(g);
}
function bath(group, x0,z0,x1,z1, y=0){
  counterRun(group, x0+0.1,z0+0.15, x0+0.6,z1-0.15, y, 0.86);
  const wc=new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,.42,14), M.white);
  wc.position.set(x1-0.45,y+0.21,z0+0.45); wc.castShadow=true; group.add(wc);
  box(group, M.glass, x1-1.0,y,z1-1.0, x1-0.96,y+2.0,z1-0.1, {shadow:false});
  box(group, M.glass, x1-1.0,y,z1-0.14, x1-0.1,y+2.0,z1-0.1, {shadow:false});
}

/* ============================== LABELS =============================== */
function makeLabel(text){
  const c=document.createElement('canvas'); const g=c.getContext('2d');
  g.font='600 42px Segoe UI, sans-serif';
  const w=Math.ceil(g.measureText(text).width)+48; c.width=w; c.height=72;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(22,19,15,.78)'; ctx.beginPath(); ctx.roundRect(0,0,w,72,16); ctx.fill();
  ctx.font='600 42px Segoe UI, sans-serif'; ctx.fillStyle='#f3ead7';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, w/2, 38);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));
  spr.scale.set(w/72*0.55, 0.55, 1); spr.renderOrder=999;
  return spr;
}
for (const r of ROOMS){
  const s = makeLabel(r.name);
  s.position.set(r.cx, r.floorY + r.labelY, r.cz);
  G.labels.add(s);
}
G.labels.visible = false;

/* ======================= PLAYER / CONTROLS =========================== */
const player = {
  pos: new THREE.Vector3(3.4, 0, 17.0),   // garden by the pool, looking at the house
  yaw: -1.9, pitch: -0.02,
  velY: 0, grounded: true,
  H: 1.7, EYE: 1.62, R: 0.32, STEP: 0.42,
};
const keys = {};
addEventListener('keydown', e => {
  keys[e.code]=true;
  if (e.code==='KeyV') setMode(mode==='walk'?'orbit':'walk');
  if (e.code==='KeyL') toggleLabels();
  if (e.code==='KeyE') jumpFloor(1);
  if (e.code==='KeyQ') jumpFloor(-1);
});
addEventListener('keyup', e => keys[e.code]=false);

let mode = 'walk';
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(17, 1, 14); orbit.enableDamping = true; orbit.enabled = false;
orbit.maxPolarAngle = Math.PI/2 - 0.02;

const lockHint = document.getElementById('lockHint');
const cross = document.getElementById('cross');
renderer.domElement.addEventListener('click', () => {
  if (mode==='walk' && !isTouch) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === renderer.domElement;
  cross.style.display = locked ? 'block':'none';
  lockHint.classList.toggle('hidden', locked || mode!=='walk');
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  player.yaw   -= e.movementX * 0.0023;
  player.pitch -= e.movementY * 0.0023;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
});

const isTouch = matchMedia('(pointer:coarse)').matches;
const joy = { mx:0, mz:0, lx:0, ly:0 };
function bindJoy(el, cb){
  const knob = el.querySelector('.knob'); let id=null, cx=0, cy=0;
  el.addEventListener('pointerdown', e=>{ id=e.pointerId; cx=e.clientX; cy=e.clientY; el.setPointerCapture(id); });
  el.addEventListener('pointermove', e=>{
    if (e.pointerId!==id) return;
    const dx=Math.max(-45,Math.min(45,e.clientX-cx)), dy=Math.max(-45,Math.min(45,e.clientY-cy));
    knob.style.transform=`translate(${dx}px,${dy}px)`; cb(dx/45, dy/45);
  });
  const end=e=>{ if(e.pointerId!==id)return; id=null; knob.style.transform=''; cb(0,0); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
bindJoy(document.getElementById('joyL'), (x,y)=>{ joy.mx=x; joy.mz=y; });
bindJoy(document.getElementById('joyR'), (x,y)=>{ joy.lx=x; joy.ly=y; });

function collides(px, py, pz){
  const r=player.R;
  for (const c of colliders){
    if (px+r>c.min.x && px-r<c.max.x && pz+r>c.min.z && pz-r<c.max.z &&
        py+player.H>c.min.y+0.001 && py<c.max.y-0.001) return true;
  }
  return false;
}
function supportY(px, pz, py){
  let s = -100;
  const r=player.R*0.8;
  for (const c of colliders){
    if (px+r>c.min.x && px-r<c.max.x && pz+r>c.min.z && pz-r<c.max.z){
      if (c.max.y <= py + player.STEP + 0.001 && c.max.y > s) s = c.max.y;
    }
  }
  return s;
}
function moveAxis(dx, dz){
  const p=player.pos;
  for (const [mx,mz] of [[dx,0],[0,dz]]){
    if (!mx && !mz) continue;
    let nx=p.x+mx, nz=p.z+mz;
    if (!collides(nx, p.y+0.05, nz)) { p.x=nx; p.z=nz; continue; }
    if (!collides(nx, p.y+player.STEP, nz)) { p.x=nx; p.z=nz; p.y+=player.STEP; continue; }
  }
}
function jumpFloor(dir){
  const targets=[FLOOR_B, FLOOR_G, FLOOR_U];
  let cur = targets.reduce((a,b)=>Math.abs(b-player.pos.y)<Math.abs(a-player.pos.y)?b:a);
  let i = targets.indexOf(cur)+dir;
  if (i<0||i>=targets.length) return;
  const t=targets[i];
  const spots={ [FLOOR_B]:[28.5,8.3], [FLOOR_G]:[30.5,8.5], [FLOOR_U]:[27.3,9.5] };
  let [sx,sz]=spots[t];
  if (insideAnyRoom(player.pos.x, player.pos.z, t)) { sx=player.pos.x; sz=player.pos.z; }
  player.pos.set(sx, t, sz); player.velY=0;
}
function insideAnyRoom(x,z,fy){
  return ROOMS.some(r=>r.floorY===fy && x>r.x0+0.4 && x<r.x1-0.4 && z>r.z0+0.4 && z<r.z1-0.4);
}

const btnWalk=document.getElementById('btnWalk'), btnOrbit=document.getElementById('btnOrbit');
function setMode(m){
  mode=m;
  btnWalk.classList.toggle('active', m==='walk');
  btnOrbit.classList.toggle('active', m==='orbit');
  orbit.enabled = m==='orbit';
  if (m==='orbit'){
    document.exitPointerLock?.();
    lockHint.classList.add('hidden');
    camera.position.set(-20, 28, 52);
    orbit.target.set(17, 0, 14);
    G.labels.visible = labelsOn = true;
  } else {
    lockHint.classList.toggle('hidden', isTouch);
    G.labels.visible = labelsOn = false;
    applyVis(true);
  }
  refreshVisUI();
}
btnWalk.onclick=()=>setMode('walk'); btnOrbit.onclick=()=>setMode('orbit');
let labelsOn=false;
function toggleLabels(){ labelsOn=!labelsOn; G.labels.visible=labelsOn; }
document.getElementById('btnLabels').onclick=toggleLabels;

const cbRoof=document.getElementById('cbRoof'), cbUpper=document.getElementById('cbUpper'), cbGround=document.getElementById('cbGround');
function applyVis(forceAll){
  G.roof.visible  = forceAll || cbRoof.checked;
  G.upper.visible = forceAll || cbUpper.checked;
  G.ground.visible= forceAll || cbGround.checked;
}
function refreshVisUI(){
  const dis = mode==='walk';
  [cbRoof,cbUpper,cbGround].forEach(c=>c.disabled=dis);
  applyVis(mode==='walk');
}
[cbRoof,cbUpper,cbGround].forEach(c=>c.onchange=()=>applyVis(false));
refreshVisUI();

const sel=document.getElementById('teleport');
const groups={ [FLOOR_U]:'Pav. Superior', [FLOOR_G]:'Pav. Térreo', [FLOOR_B]:'Subsolo' };
for (const fy of [FLOOR_G, FLOOR_U, FLOOR_B]){
  const og=document.createElement('optgroup'); og.label=groups[fy];
  ROOMS.filter(r=>r.floorY===fy).forEach(r=>{
    const o=document.createElement('option'); o.value=ROOMS.indexOf(r); o.textContent=r.name; og.appendChild(o);
  });
  sel.appendChild(og);
}
sel.onchange=()=>{
  const r=ROOMS[+sel.value]; if(!r) return;
  const w=r.x1-r.x0, d=r.z1-r.z0;
  let px=r.cx, pz=r.cz, yaw;
  if (w >= d){ px=r.x0+w*0.3; yaw=-Math.PI/2; }
  else       { pz=r.z0+d*0.3; yaw=Math.PI; }
  player.pos.set(px, r.floorY, pz); player.velY=0;
  player.yaw=yaw; player.pitch=-0.02;
  setMode('walk'); sel.value='';
};

const roomNameEl=document.getElementById('roomName'), floorNameEl=document.getElementById('floorName');
function updateRoomTag(){
  const y=player.pos.y;
  const fy=[FLOOR_B,FLOOR_G,FLOOR_U].reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a);
  const r=ROOMS.find(r=>r.floorY===fy && player.pos.x>r.x0&&player.pos.x<r.x1&&player.pos.z>r.z0&&player.pos.z<r.z1);
  floorNameEl.textContent = groups[fy] ?? '';
  roomNameEl.textContent = r ? r.name : (y<-1.2 ? 'Rua / Acesso' : (fy===FLOOR_G?'Jardim / Exterior':'—'));
}

/* ============================== LOOP ================================= */
function updateWalk(dt){
  player.yaw -= joy.lx*dt*2.2; player.pitch -= joy.ly*dt*1.6;
  player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch));
  const run = keys['ShiftLeft']||keys['ShiftRight'] ? 2.1 : 1;
  const sp = 3.4*run*dt;
  let fx=0, fz=0;
  if (keys['KeyW']||keys['ArrowUp']) fz+=1;
  if (keys['KeyS']||keys['ArrowDown']) fz-=1;
  if (keys['KeyA']||keys['ArrowLeft']) fx-=1;
  if (keys['KeyD']||keys['ArrowRight']) fx+=1;
  fz += -joy.mz; fx += joy.mx;
  const len=Math.hypot(fx,fz)||1;
  const sin=Math.sin(player.yaw), cos=Math.cos(player.yaw);
  if (fx||fz) moveAxis(( fx*cos - fz*sin)/len*sp, (-fx*sin - fz*cos)/len*sp);
  const s=supportY(player.pos.x, player.pos.z, player.pos.y);
  if (player.pos.y > s+0.02){ player.velY-=18*dt; player.pos.y=Math.max(s, player.pos.y+player.velY*dt); }
  else { player.pos.y=s; player.velY=0; }
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(), 0.05);
  texWater.offset.x += dt*0.02; texWater.offset.y += dt*0.013;
  if (mode==='walk'){
    updateWalk(dt);
    camera.position.set(player.pos.x, player.pos.y+player.EYE, player.pos.z);
    camera.rotation.set(0,0,0,'YXZ');
    camera.rotation.order='YXZ';
    camera.rotation.y=player.yaw; camera.rotation.x=player.pitch;
    updateRoomTag();
  } else {
    orbit.update();
  }
  renderer.render(scene, camera);
}
setMode('walk');
animate();
window.__dbg = { player, colliders, keys,
  setPos:(x,y,z,yaw)=>{ player.pos.set(x,y,z); if(yaw!==undefined) player.yaw=yaw; player.velY=0; },
  sim:(sec)=>{ for(let i=0;i<sec*60;i++) updateWalk(1/60); } };
</script>
</body>
